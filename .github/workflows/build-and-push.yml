name: build-and-push

# Display name of the run. run-name is evaluated before any job runs, so it
# cannot read package.json. The version prefix therefore comes from the commit
# subject: .husky/commit-msg prepends "v<MAJOR.MINOR.PATCH> — " (see
# scripts/prefix-version.mjs), and GitHub uses the commit subject as run name.
# Manual runs use the title from the workflow_dispatch input, PR runs the PR
# title. HARD RULE: every push run MUST start with "v<MAJOR.MINOR.PATCH> — ".
run-name: ${{ inputs.name || github.event.head_commit.message || github.event.pull_request.title || '' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      name:
        description: 'Titel des Builds (optional, z. B. "Akkutausch-Verwaltung")'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # Runs auf main werden pro Ref nacheinander abgearbeitet, damit :latest
  # nie von einem aelteren, spaeter fertigen Lauf ueberschrieben wird. Ein
  # zwischenzeitig verdrangter Lauf wird nicht gebaut, das ist beabsichtigt.

jobs:
  # ---------- Version ----------
  # Liest die Versionsnummern aus beiden package.json (Root=PWA, server=API)
  # und stellt sie als Outputs bereit. Läuft bei jedem Event, damit die
  # nachfolgenden Jobs auch bei PRs/Workflow-Dispatch darauf zugreifen können
  # (dort werden die Images nicht gepusht, aber die Outputs sind vorhanden).
  version:
    runs-on: ubuntu-latest
    outputs:
      rootVersion: ${{ steps.read-version.outputs.rootVersion }}
      serverVersion: ${{ steps.read-version.outputs.serverVersion }}
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        id: read-version
        run: |
          ROOT_VERSION=$(node -e "console.log(require('./package.json').version)")
          SERVER_VERSION=$(node -e "console.log(require('./server/package.json').version)")
          echo "rootVersion=$ROOT_VERSION" >> $GITHUB_OUTPUT
          echo "serverVersion=$SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "::notice title=Build version::PWA v$ROOT_VERSION / API v$SERVER_VERSION"

  # ---------- API ----------
  # api-check prueft den Code (Checkout, Node, Install, Lint, Typecheck, Test,
  # Build). Kein Docker, kein Image-Push. Läuft bei jedem Event.
  # api-publish baut und pusht das API-Image erst, nachdem BEIDE Check-Jobs
  # (api-check und pwa-check) gruen sind. Nur ausserhalb von PRs.
  api-check:
    needs: version
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: castel
          POSTGRES_PASSWORD: castel
          POSTGRES_DB: castel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U castel -d castel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: server
        run: npm run lint || true # Server-Lint ist optional, ESLint teilt mit Frontend

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Migrate test database
        working-directory: server
        env:
          DATABASE_URL: postgres://castel:castel@127.0.0.1:5432/castel
        run: npm run db:migrate

      - name: Test
        working-directory: server
        # Datenbank-Integrationstests brauchen eine echte, migrierte Postgres.
        # Sie melden sich via CASTEL_TEST_DB=1 + DATABASE_URL selbst und
        # skippen sich ohne beides (describe.skipIf). Die CI liefert hier den
        # laufenden postgres-Service, damit die DB-Schicht nicht ungetestet
        # bleibt. JWT_SECRET/DATANORM_DIR sind Platzhalter, die der Config-
        # Import braucht, ohne eine echte Verbindung aufzubauen.
        env:
          DATABASE_URL: postgres://castel:castel@127.0.0.1:5432/castel
          CASTEL_TEST_DB: '1'
          JWT_SECRET: ci-placeholder-secret-at-least-32-characters
          DATANORM_DIR: /tmp/castel-ci-datanorm
        run: npm run test:run

  api-publish:
    needs: [version, api-check, pwa-check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/castel-api:latest
            ghcr.io/${{ github.repository_owner }}/castel-api:pre-release
            ghcr.io/${{ github.repository_owner }}/castel-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/castel-api:v${{ needs.version.outputs.serverVersion }}
          # Commit/Branch als Build-Args durchreichen, damit der Server
          # die installierte Version (GIT_COMMIT) kennt und der
          # Update-Endpunkt ohne Zusatzkonfiguration funktioniert.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          labels:
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ---------- PWA ----------
  # pwa-check prueft den Code (Checkout, Node, Install, Lint, Typecheck, Test,
  # Build mit UTF-8-Env). Kein Docker, kein Image-Push. Läuft bei jedem Event.
  # pwa-publish baut und pusht das PWA-Image erst, nachdem BEIDE Check-Jobs
  # (api-check und pwa-check) gruen sind. Nur ausserhalb von PRs.
  pwa-check:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate version info
        run: npm run version:write

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        # UTF-8-Locale setzen, BEVOR 'npm run build' Strings schreibt.
        # Ohne das transcodiert vite/rollup die mehrbyte-Zeichen
        # (U+23FB, U+2026, Emojis, Umlaute) in der C/POSIX-Default-
        # Locale des ubuntu-latest-Runners, und das Ergebnis im
        # GHCR-Image zeigt im Browser Mojibake. Dockerfile.pwa
        # braucht dasselbe ENV, weil 'npm run build' dort
        # nochmal laeuft (sonst wuerde der Image-eigene Build,
        # z. B. bei manuellem 'docker build', wieder kaputt sein).
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          TZ: Europe/Berlin
        run: npm run build

  pwa-publish:
    needs: [version, api-check, pwa-check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pwa
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/castel-pwa:latest
            ghcr.io/${{ github.repository_owner }}/castel-pwa:pre-release
            ghcr.io/${{ github.repository_owner }}/castel-pwa:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/castel-pwa:v${{ needs.version.outputs.rootVersion }}
          # Commit/Branch als Build-Args durchreichen, damit version.ts im
          # Image die echten Werte hat (docker buildx hat kein .git/).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          labels:
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=pwa
          cache-to: type=gha,mode=max,scope=pwa
