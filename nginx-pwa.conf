# ---- http -> https upgrade (.env-driven, see scripts/pwa-entrypoint.sh) ----
#
# The stack itself serves plain HTTP on port 3000: TLS terminates in front of
# it (Cloudflare, Caddy, own nginx) or does not exist at all (LAN). Typing the
# bare domain in the address bar therefore asks for http and lands in an
# insecure browser context, where the PWA refuses to log in. The browser does
# not upgrade that on its own, so we send a 301 here - but only where we can
# prove that https exists:
#
#   * LAN hosts (localhost, plain IP) never get a redirect - they have no TLS
#     at all, and a 301 would exchange a readable error for a dead end.
#   * Cloudflare "Flexible SSL" always talks plain http to the origin; a 301
#     there would loop forever.
#   * Requests that already arrived as https ($scheme or the proxy header
#     X-Forwarded-Proto) are served normally.
#
# The decision itself lives in $castel_redirect, which the entrypoint snippet
# /etc/nginx/force-https-on.conf initialises to 1 and resets for the cases
# above; without that snippet the variable stays empty and nothing redirects.
# The redirect then sits in the catch-all `location /` further below.

# LAN hosts: localhost, 127.x and a plain IP address (optionally with port).
map $host $castel_host_is_lan {
    ~^localhost    1;
    ~^127\.        1;
    ~^[0-9.]+$     1;
    ~^[0-9.]+:[0-9]+$ 1;
    default        0;
}

# Cloudflare Flexible SSL markers - both say "http to the origin".
map $http_x_flexible_proto $castel_cf_flexible {
    http    1;
    default 0;
}
map $http_cf_use_secure_socket $castel_cf_insecure {
    off     1;
    default 0;
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Written by the container entrypoint when FORCE_HTTPS is on. It sets
    # $castel_redirect and $castel_https_target; the glob include tolerates the
    # file being absent (= no redirect at all).
    include /etc/nginx/force-https-*.conf;

    # Default-Charset für text/*-Responses (HTML, CSS, plain).
    # ACHTUNG: Wirkt NICHT für application/javascript, application/json oder
    # application/manifest+json — die bekommen das charset automatisch NICHT.
    # Darum setzen wir 'charset=utf-8' weiter unten EXPLIZIT pro Response-Type.
    charset utf-8;

    # Security-Header (CSP, X-Frame-Options, nosniff, Referrer-Policy,
    # Permissions-Policy). nginx erbt add_header aus dem Server-Block nur,
    # wenn die Location selbst KEIN add_header setzt — die Cache-Header
    # unten tun das. Deshalb wird das Snippet in jeder Location geladen.
    include /etc/nginx/security-headers.conf;

    # Healthz für Container-Healthcheck
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Service Worker + Workbox-Helpers: kein Caching + expliziter charset.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /workbox-.*\.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }

    # Runtime-Config: vom Container-Entrypoint aus $VITE_API_URL generiert.
    # Darf nicht aus dem Browser-Cache kommen, sonst greift eine alte URL
    # nach einem Compose-Update.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }

    # Reverse-Proxy zur API (Fastify). Damit ist nur EIN Host-Port noetig
    # (PWA_PORT) — die API wird ueber /api/ im selben Origin angesprochen.
    # Der 'api'-Service ist im Compose-Network 'internal' erreichbar.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        # Antwort-Charset der API durchreichen (Fastify liefert meist
        # application/json; charset=utf-8 — hier nur absichern).
        proxy_set_header Accept-Charset "utf-8";

        # ---- Upload-Groesse ----
        # nginx-Default ist 1 MB! Jeder DATANORM-Katalog groesser als 1 MB
        # wurde mit 413 abgewiesen, bevor die API ihn überhaupt sah. Das
        # Limit muss groesser sein als DATANORM_MAX_FILE_BYTES der API
        # (500 MB) — nginx ist die aeussere Schranke und soll nur groessere
        # Werte als die API zulassen, damit deren eigene Fehlermeldung
        # greift. Fotos (512 kB) sind davon weit entfernt.
        client_max_body_size 512m;

        # ---- Timeouts fuer grosse Uploads ----
        # Defaults sind zu knapp: proxy_send_timeout 60s bricht den
        # Upstream-Write ab, client_body_timeout 60s bricht den Body-Read
        # ab. Ein Katalog ueber eine langsame Leitung braucht mehr.
        client_body_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # Fotos (statische Dateien vom API-Container via /fotos/*).
    # Die Bilder liegen im FOTOS_DIR-Volume des API-Containers und werden
    # von @fastify/static unter /fotos/* ausgeliefert. Nginx hier proxied
    # sie an die API, damit der Browser sie über denselben Origin laden kann.
    location /fotos/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:3000/fotos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Manifest: expliziter charset, sonst raten manche Browser daneben.
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/manifest+json; charset=utf-8";
    }

    # Statische Assets (Hashed) — Cache-Forever.
    # Per-Datei Charset je nach Endung, weil `charset utf-8;` allein für
    # application/javascript nicht greift.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* /assets/.*\.css$ {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type "text/css; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /assets/.*\.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /assets/.*\.json$ {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type "application/json; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /assets/.*\.svg$ {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type "image/svg+xml; charset=utf-8";
        try_files $uri =404;
    }

    # Icons, PWA-Assets (Binary, kein charset nötig)
    location ~* \.(png|ico|webp|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA-Fallback: alles, was nicht als Datei existiert, geht auf index.html.
    # index.html selbst hat <meta charset="UTF-8"> und fällt zusätzlich unter
    # `charset utf-8;` oben — also doppelt abgesichert.
    #
    # http -> https: $castel_redirect/$castel_https_target only get set by the
    # entrypoint snippet /etc/nginx/force-https-on.conf (FORCE_HTTPS on).
    # Untouched there means empty -> no redirect. Only this catch-all: /api/
    # and /fotos/ keep serving plain http (the LAN needs that), and a browser
    # that already loaded the page over https asks https for its subresources.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        if ($castel_redirect = 1) {
            return 301 $castel_https_target$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
