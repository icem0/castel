server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default-Charset für text/*-Responses (HTML, CSS, plain).
    # ACHTUNG: Wirkt NICHT für application/javascript, application/json oder
    # application/manifest+json — die bekommen das charset automatisch NICHT.
    # Darum setzen wir 'charset=utf-8' weiter unten EXPLIZIT pro Response-Type.
    charset utf-8;

    # Healthz für Container-Healthcheck
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Service Worker + Workbox-Helpers: kein Caching + expliziter charset.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }

    # Runtime-Config: vom Container-Entrypoint aus $VITE_API_URL generiert.
    # Darf nicht aus dem Browser-Cache kommen, sonst greift eine alte URL
    # nach einem Compose-Update.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }

    # Reverse-Proxy zur API (Fastify). Damit ist nur EIN Host-Port noetig
    # (PWA_PORT) — die API wird ueber /api/ im selben Origin angesprochen.
    # Der 'api'-Service ist im Compose-Network 'internal' erreichbar.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        # Antwort-Charset der API durchreichen (Fastify liefert meist
        # application/json; charset=utf-8 — hier nur absichern).
        proxy_set_header Accept-Charset "utf-8";

        # ---- Upload-Groesse ----
        # nginx-Default ist 1 MB! Jeder DATANORM-Katalog groesser als 1 MB
        # wurde mit 413 abgewiesen, bevor die API ihn überhaupt sah. Das
        # Limit muss groesser sein als DATANORM_MAX_FILE_BYTES der API
        # (500 MB) — nginx ist die aeussere Schranke und soll nur groessere
        # Werte als die API zulassen, damit deren eigene Fehlermeldung
        # greift. Fotos (512 kB) sind davon weit entfernt.
        client_max_body_size 512m;

        # ---- Timeouts fuer grosse Uploads ----
        # Defaults sind zu knapp: proxy_send_timeout 60s bricht den
        # Upstream-Write ab, client_body_timeout 60s bricht den Body-Read
        # ab. Ein Katalog ueber eine langsame Leitung braucht mehr.
        client_body_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # Fotos (statische Dateien vom API-Container via /fotos/*).
    # Die Bilder liegen im FOTOS_DIR-Volume des API-Containers und werden
    # von @fastify/static unter /fotos/* ausgeliefert. Nginx hier proxied
    # sie an die API, damit der Browser sie über denselben Origin laden kann.
    location /fotos/ {
        proxy_pass http://api:3000/fotos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Manifest: expliziter charset, sonst raten manche Browser daneben.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/manifest+json; charset=utf-8";
    }

    # Statische Assets (Hashed) — Cache-Forever.
    # Per-Datei Charset je nach Endung, weil `charset utf-8;` allein für
    # application/javascript nicht greift.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* /assets/.*\.css$ {
        add_header Content-Type "text/css; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /assets/.*\.js$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /assets/.*\.json$ {
        add_header Content-Type "application/json; charset=utf-8";
        try_files $uri =404;
    }
    location ~* /assets/.*\.svg$ {
        add_header Content-Type "image/svg+xml; charset=utf-8";
        try_files $uri =404;
    }

    # Icons, PWA-Assets (Binary, kein charset nötig)
    location ~* \.(png|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA-Fallback: alles, was nicht als Datei existiert, geht auf index.html.
    # index.html selbst hat <meta charset="UTF-8"> und fällt zusätzlich unter
    # `charset utf-8;` oben — also doppelt abgesichert.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
