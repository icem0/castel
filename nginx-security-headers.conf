# Security-Header fuer die PWA (nginx).
#
# Wird per `include` in jede Location geladen, die Inhalt ausliefert —
# nginx erbt add_header aus dem Server-Block nur, wenn die Location selbst
# KEIN add_header setzt (Cache-Control tut das hier ueberall).
#
# Hinweis zur CSP:
#   - script-src ohne 'unsafe-inline' blockt Inline-Event-Handler
#     (`<img onerror=...>`) — genau der Vektor aus dem HTML-Sniffing.
#   - 'unsafe-eval' + 'wasm-unsafe-eval' sind noetig, weil die OCR im
#     Browser (tesseract.js) WebAssembly kompiliert.
#   - connect-src erlaubt http(s), weil die API bei getrenntem Betrieb
#     unter VITE_API_URL auf einem anderen Origin laufen kann. data:/blob:
#     sind bewusst NICHT erlaubt (Exfiltrationsvektor).
#   - frame-ancestors 'none' ersetzt X-Frame-Options (Clickjacking).
#   - camera=(self) bleibt erlaubt — die Kommission-Kamera braucht getUserMedia.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https:; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
